<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MineLand Center - {{ page_title }}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <!-- HEADER -->

    <header class="main-header">

        <div class="logo">

            <h1>MineLand Center</h1>

        </div>

        <!-- NAVBAR -->

        <nav class="navbar">

            <ul class="nav-links">

                <li>
                    <a href="{{ url_for('home') }}">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('about') }}">
                        Nosotros
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('contact') }}">
                        Contacto
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- CONTENIDO -->

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 MineLand Center
        </p>

    </footer>

</body>
</html>
