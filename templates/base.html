<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MineLand Center - {{ page_title }}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <header class="main-header">

        <div class="logo">
            <h1>MineLand Center</h1>
        </div>

        <nav class="navbar">

            <ul class="nav-links left-links">
                <li>
                    <a href="{{ url_for('home') }}">Inicio</a>
                </li>

                <li>
                    <a href="{{ url_for('about') }}">Nosotros</a>
                </li>

                <li>
                    <a href="{{ url_for('contact') }}">Contacto</a>
                </li>

                <li>
                    <a href="{{ url_for('cart_page') }}">Carrito</a>
                </li>
            </ul>

            <ul class="nav-links right-links">
                <li>
                    <a href="{{ url_for('login') }}">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('dashboard') }}">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('logout') }}">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>
            </ul>

        </nav>

    </header>

    <section class="search-section">

        <form
            action="{{ url_for('home') }}"
            method="GET"
            class="search-form"
        >
            <input
                type="text"
                name="search"
                placeholder="Buscar productos..."
            >

            <button type="submit">
                Buscar
            </button>
        </form>

    </section>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 MineLand Center</p>
        <p>Plataforma gaming desarrollada con Flask</p>
    </footer>

</body>
</html>
