{% extends 'base.html' %}

{% block content %}

<section>

    <h2 class="section-title">
        Dashboard Admin
    </h2>

    <div style="text-align:center; margin-top:20px;">

        <a
            href="{{ url_for('add_product') }}"
            class="btn-primary"
        >
            Agregar Producto
        </a>

    </div>

    <div class="dashboard-grid">

        {% for product in products %}

        <div class="dashboard-card">

            <img
                src="{{ url_for(
                    'static',
                    filename=product.image_url
                ) }}"
                alt="{{ product.name }}"
            >

            <h3>{{ product.name }}</h3>

            <p class="price">
                ${{ product.price }}
            </p>

            <div class="detail-buttons">

                <a
                    href="{{ url_for(
                        'edit_product',
                        product_id=product.id
                    ) }}"
                    class="btn-secondary"
                >
                    Editar
                </a>

                <a
                    href="{{ url_for(
                        'delete_product',
                        product_id=product.id
                    ) }}"
                    class="remove-btn"
                >
                    Eliminar
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
