{% extends 'base.html' %}

{% block content %}

<div class="dashboard-header">

    <h2>Dashboard Admin</h2>

    <a
        href="{{ url_for('add_product') }}"
        class="btn-primary"
    >
        Agregar Producto
    </a>

</div>

<div class="product-grid">

    {% for product in products %}

    <div class="product-card">

        <img
            src="{{ url_for(
                'static',
                filename=product.image_url
            ) }}"
        >

        <div class="product-info">

            <h3>{{ product.name }}</h3>

            <p>${{ product.price }}</p>

            <a
                href="{{ url_for(
                    'edit_product',
                    product_id=product.id
                ) }}"
                class="btn-secondary"
            >
                Editar
            </a>

            <a
                href="{{ url_for(
                    'delete_product',
                    product_id=product.id
                ) }}"
                class="btn-danger"
            >
                Eliminar
            </a>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
