{% extends 'base.html' %}

{% block content %}

<h2 class="section-title">
    Carrito de Compras
</h2>

{% if cart %}

<div class="cart-container">

    {% for item in cart %}

    <div class="cart-item">

        <img
            src="{{ url_for(
                'static',
                filename=item.image_url
            ) }}"
        >

        <div>

            <h3>{{ item.name }}</h3>

            <p>S/{{ item.price }}</p>

            <a
                href="{{ url_for(
                    'remove_from_cart',
                    index=loop.index0
                ) }}"
                class="btn-danger"
            >
                Eliminar
            </a>

        </div>

    </div>

    {% endfor %}

    <h3>Total: S/{{ total }}</h3>

    <a
        href="{{ url_for('clear_cart') }}"
        class="btn-danger"
    >
        Vaciar Carrito
    </a>

</div>

{% else %}

<p>
    El carrito está vacío.
</p>

{% endif %}

{% endblock %}
