{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>Editar Producto</h2>

    <form
        action="{{ url_for('edit_product', product_id=product.id) }}"
        method="POST"
    >

        <label>Nombre del producto</label>

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            placeholder="Nombre del producto"
            required
        >

        <label>Precio (S/)</label>

        <input
            type="number"
            step="0.01"
            min="0"
            name="price"
            value="{{ product.price }}"
            required
        >

        <label>Stock disponible</label>

        <input
            type="number"
            min="0"
            name="stock"
            value="{{ product.stock }}"
            required
        >

        <label>Descripción</label>

        <textarea
            name="description"
            rows="5"
            required
        >{{ product.description }}</textarea>

        <label>Nombre de la imagen</label>

        <input
            type="text"
            name="image_url"
            value="{{ product.image_url.replace('images/', '') }}"
            placeholder="ejemplo.jpg"
            required
        >

        <button
            type="submit"
            class="btn-primary"
        >
            💾 Guardar Cambios
        </button>

        <a
            href="{{ url_for('dashboard') }}"
            class="btn-secondary"
        >
            ← Cancelar
        </a>

    </form>

</div>

{% endblock %}
