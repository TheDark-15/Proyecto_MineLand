{% extends 'base.html' %}

{% block content %}

<!-- =====================================================
EDITAR PRODUCTO
===================================================== -->

<section class="add-product-container">

    <h2>

        Editar Producto

    </h2>

    <!-- FORMULARIO -->

    <form
        method="POST"
        class="add-product-form"
    >

        <!-- NOMBRE -->

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            placeholder="Nombre del producto"
            required
        >

        <!-- PRECIO -->

        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product.price }}"
            placeholder="Precio"
            required
        >

        <!-- DESCRIPCIÓN -->

        <textarea
            name="description"
            placeholder="Descripción"
            required
        >{{ product.description }}</textarea>

        <!-- IMAGEN -->

        <input
            type="text"
            name="image_url"
            value="{{ product.image_url
                .replace('images/', '') }}"
            placeholder="ps5.jpg"
            required
        >

        <!-- BOTÓN -->

        <button type="submit">

            Guardar Cambios

        </button>

    </form>

</section>

{% endblock %}
