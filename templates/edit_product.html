{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>✏ Editar Producto</h2>

    <form method="POST">

        <label for="name">
            Nombre del producto
        </label>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ product.name }}"
            maxlength="100"
            required
        >

        <label for="price">
            Precio (S/)
        </label>

        <input
            type="number"
            id="price"
            name="price"
            value="{{ product.price }}"
            step="0.01"
            min="0"
            required
        >

        <label for="stock">
            Stock disponible
        </label>

        <input
            type="number"
            id="stock"
            name="stock"
            value="{{ product.stock }}"
            min="0"
            required
        >

        <label for="description">
            Descripción
        </label>

        <textarea
            id="description"
            name="description"
            rows="5"
            required
        >{{ product.description }}</textarea>

        <label for="image_url">
            Nombre de la imagen
        </label>

        <input
            type="text"
            id="image_url"
            name="image_url"
            value="{{ product.image_url.replace('images/', '') }}"
            required
        >

        <small>
            La imagen debe existir dentro de
            <strong>static/images/</strong>
        </small>

        <br><br>

        <button
            type="submit"
            class="btn-primary"
        >
            💾 Guardar Cambios
        </button>

        <a
            href="{{ url_for('dashboard') }}"
            class="btn-secondary"
        >
            ← Cancelar
        </a>

    </form>

</div>

{% endblock %}
