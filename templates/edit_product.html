{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>Editar Producto</h2>

    <form method="POST">

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required
        >

        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product.price }}"
            required
        >

        <textarea
            name="description"
            required
        >{{ product.description }}</textarea>

        <input
            type="text"
            name="image_url"
            value="{{ product.image_url.replace('images/', '') }}"
            required
        >

        <button type="submit" class="btn-primary">
            Actualizar
        </button>

    </form>

</div>

{% endblock %}
