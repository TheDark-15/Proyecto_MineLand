{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>Iniciar Sesión</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Usuario"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit" class="btn-primary">
            Ingresar
        </button>

    </form>

</div>

{% endblock %}
