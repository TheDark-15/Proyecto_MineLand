{% extends 'base.html' %}

{% block content %}

<section class="product-detail">

    <div class="product-detail-image">

        <img
            src="{{ url_for(
                'static',
                filename=product.image_url
            ) }}"
            alt="{{ product.name }}"
        >

    </div>

    <div class="product-detail-info">

        <h2>

            {{ product.name }}

        </h2>

        <p class="detail-price">

            ${{ product.price }}

        </p>

        <p class="detail-description">

            {{ product.description }}

        </p>

        <a
            href="{{ url_for(
                'add_to_cart',
                product_id=product.id
            ) }}"
            class="btn-cart"
        >

            Agregar al carrito

        </a>

    </div>

</section>

{% endblock %}
