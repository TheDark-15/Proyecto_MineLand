{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h2>Registro de Usuario</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Usuario"
            required>

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required>

        <button type="submit">
            Registrarse
        </button>

    </form>

    {% with messages=get_flashed_messages() %}
        {% for message in messages %}
            <p style="color:green">
                {{message}}
            </p>
        {% endfor %}
    {% endwith %}

</div>

{% endblock %}
