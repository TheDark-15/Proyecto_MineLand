{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>👤 Registro de Cliente</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="success">
            {{ success }}
        </div>
    {% endif %}

    <form
        action="{{ url_for('register_customer') }}"
        method="POST"
    >

        <label for="name">
            Nombre completo
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Ingrese su nombre completo"
            maxlength="100"
            required
        >

        <label for="email">
            Correo electrónico
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="correo@ejemplo.com"
            maxlength="100"
            required
        >

        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingrese una contraseña"
            minlength="6"
            required
        >

        <label for="confirm_password">
            Confirmar contraseña
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Repita la contraseña"
            minlength="6"
            required
        >

        <br>

        <button
            type="submit"
            class="btn-primary"
        >
            👤 Registrarse
        </button>

        <a
            href="{{ url_for('login') }}"
            class="btn-secondary"
        >
            🔑 Ya tengo una cuenta
        </a>

    </form>

</div>

{% endblock %}
