{% extends 'base.html' %}

{% block content %}

<div class="checkout-box">

<h2>Finalizar Compra</h2>

<h3>Total: S/ {{ "%.2f"|format(total) }}</h3>

<form method="POST">

<label>Código de pago</label>

<input
type="password"
name="payment"
placeholder="Ingrese 123456"
required
>

<button
type="submit"
class="btn-primary">
Confirmar Compra
</button>

</form>

</div>

{% endblock %}
