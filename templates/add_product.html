{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>Agregar Producto</h2>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Nombre"
            required
        >

        <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Precio"
            required
        >

        <textarea
            name="description"
            placeholder="Descripción"
            required
        ></textarea>

        <input
            type="text"
            name="image_url"
            placeholder="ejemplo.jpg"
            required
        >

        <button type="submit" class="btn-primary">
            Guardar
        </button>

    </form>

</div>

{% endblock %}
