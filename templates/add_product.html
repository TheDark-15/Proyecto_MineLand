{% extends 'base.html' %}

{% block content %}

<section class="add-product-container">

    <h2>
        Agregar Producto
    </h2>

    <form method="POST" class="add-product-form">

        <input
            type="text"
            name="name"
            placeholder="Nombre"
            required
        >

        <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Precio"
            required
        >

        <textarea
            name="description"
            placeholder="Descripción"
            required
        ></textarea>

        <input
            type="text"
            name="image_url"
            placeholder="ps5.jpg"
            required
        >

        <button type="submit">

            Guardar Producto

        </button>

    </form>

</section>

{% endblock %}
