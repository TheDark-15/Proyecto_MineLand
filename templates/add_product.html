{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>Agregar Producto</h2>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Nombre del producto"
            required
        >

        <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Precio"
            required
        >

        <input
            type="number"
            name="stock"
            placeholder="Stock disponible"
            min="0"
            required
        >

        <textarea
            name="description"
            placeholder="Descripción"
            required
        ></textarea>

        <input
            type="text"
            name="image_url"
            placeholder="ejemplo.jpg"
            required
        >

        <button
            type="submit"
            class="btn-primary"
        >
            Guardar Producto
        </button>

    </form>

</div>

{% endblock %}
