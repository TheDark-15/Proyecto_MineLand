{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>➕ Agregar Producto</h2>

    <form method="POST">

        <label for="name">
            Nombre del producto
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Ej. PlayStation 5"
            maxlength="100"
            required
        >

        <label for="price">
            Precio
        </label>

        <input
            type="number"
            id="price"
            name="price"
            placeholder="0.00"
            step="0.01"
            min="0"
            required
        >

        <label for="stock">
            Stock disponible
        </label>

        <input
            type="number"
            id="stock"
            name="stock"
            placeholder="Cantidad"
            min="0"
            required
        >

        <label for="description">
            Descripción
        </label>

        <textarea
            id="description"
            name="description"
            placeholder="Descripción del producto..."
            rows="5"
            required
        ></textarea>

        <label for="image_url">
            Nombre de la imagen
        </label>

        <input
            type="text"
            id="image_url"
            name="image_url"
            placeholder="ejemplo.jpg"
            required
        >

        <small>
            La imagen debe estar dentro de
            <strong>static/images/</strong>
        </small>

        <br><br>

        <button
            type="submit"
            class="btn-primary"
        >
            💾 Guardar Producto
        </button>

        <a
            href="{{ url_for('dashboard') }}"
            class="btn-secondary"
        >
            ← Cancelar
        </a>

    </form>

</div>

{% endblock %}
